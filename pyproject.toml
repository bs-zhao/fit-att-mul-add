[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fit-att-mul-add"
version = "0.1.0"
description = "SBI fitting and classifier-based comparison of 8 gaze-bias decision models"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "matplotlib>=3.7",
  "tqdm>=4.66",
  "cython>=3.0",
  "data2param-flow @ git+https://github.com/Cognition-Decision-Modeling-Lab/data2param-flow.git",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
