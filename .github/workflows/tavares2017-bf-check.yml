name: Tavares2017 BF preprocessing and compatibility

on:
  push:
    paths:
      - "run/fit_nn/tavares2017_bf/**"
      - ".github/workflows/tavares2017-bf-check.yml"
  workflow_dispatch:

jobs:
  preprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all Tavares Python files
        run: python -m compileall -q run/fit_nn/tavares2017_bf
      - name: Check Slurm launcher shell syntax
        run: bash -n run/fit_nn/tavares2017_bf/submit_three.sh
      - name: Run fixture-level unit tests
        run: python -m unittest discover -s run/fit_nn/tavares2017_bf/tests -v
      - name: Install input adapter dependencies
        run: python -m pip install numpy pandas
      - name: Rebuild dataset from public original source
        run: python -u run/fit_nn/tavares2017_bf/prepare_data.py
      - name: Verify final preprocessing fixtures
        run: python -m unittest discover -s run/fit_nn/tavares2017_bf/final_preprocessing/tests -v
      - name: Build final Tavares dataset and compare to independent Thomas 2019 reference
        run: python -u run/fit_nn/tavares2017_bf/final_preprocessing/prepare_final.py --fetch-thomas-reference
      - name: Verify final trial counts and exact downstream 17-feature conversion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          f = Path("data/tavares2017_final")
          m = json.loads((f/"prep_manifest.json").read_text())
          assert m["audited"]["final_trials"] == 30162, m
          assert m["audited"]["excluded_by_reason"]["offitem_qc_gt50pct"] == 1691
          assert m["audited"]["excluded_by_reason"]["feature_rt_limit"] == 1
          assert m["bayesflow_feature_check"]["retained_trials"] == 30162
          assert m["original_reproduced_to_thomas"]["checked"]
          assert m["original_reproduced_to_thomas"]["mismatch_count"] == 0
          print("FINAL TAVARES PASSED:",m["prepared_sha256"])
          PY
      - name: Check final training shell syntax
        run: bash -n run/fit_nn/tavares2017_bf/final_training/submit.sh
      - name: Validate isolated G2 training paths and final data with pure-Python tests
        run: python -m unittest discover -s run/fit_nn/tavares2017_bf/final_training/tests -v
      - name: Check all three planned final S4 jobs without training
        run: |
          python -u run/fit_nn/tavares2017_bf/final_training/run.py --stage s4 --family ddm --dry-run
          python -u run/fit_nn/tavares2017_bf/final_training/run.py --stage s4 --family race --dry-run
          python -u run/fit_nn/tavares2017_bf/final_training/run.py --stage s4 --family all --dry-run
      - name: Test posterior conditioning identity without BayesFlow
        run: python -m unittest discover -s run/fit_nn/tavares2017_bf/next_steps/tests -v
      - name: Verify cross-dataset model and network definitions
        run: python run/fit_nn/tavares2017_bf/next_steps/audit_alignment.py
      - name: Recheck all eye intervals and quality metrics
        run: python run/fit_nn/tavares2017_bf/next_steps/audit_original.py
      - name: Audit real-data representation and model prior shapes
        env:
          ATT_BF_VALUE_NORMALIZATION: dataset_max
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import sys
          p=Path("run/fit_nn/tavares2017_bf")
          sys.path.insert(0,str(p.resolve()))
          from _shared.data import Experiment, feature, prior_spec, model_infos
          ex=Experiment("data/tavares2017/trial_eye.csv")
          audit=json.loads(Path("data/tavares2017/prep_manifest.json").read_text())
          assert audit["original_trials"]==31854, audit
          assert len(ex.groups)==25, len(ex.groups)
          assert ex.value_max==10, ex.value_max
          assert ex.max_trials>=1000, ex.max_trials
          assert len(model_infos)==8
          ids, raw, trial_audit=ex.real()
          assert len(ids)==25, len(ids)
          assert raw["trials"].shape==(25,ex.max_trials,17),raw["trials"].shape
          assert raw["summary_mask"].shape==(25,ex.max_trials)
          assert prior_spec(["aDDM_t"])["value_normalization"]["network_feature_scale"]==[1.0,1.0]
          print("Verified:",len(ids),"subjects",raw["trials"].shape,"value max",ex.value_max)
          PY
