name: Three dataset Final1 S1-S6 contracts

on:
  push:
    paths:
      - "run/fit_nn/unified_final1.py"
      - "run/fit_nn/final1_launcher.py"
      - "run/fit_nn/*_final1/**"
      - "run/fit_nn/tests/test_unified_final1.py"
      - ".github/workflows/three-dataset-final1.yml"
  workflow_dispatch:

jobs:
  final1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install small dependency for mathematical model spec
        run: python -m pip install numpy
      - name: Compile all 3 × 6 stage entry points
        run: |
          python -m compileall -q run/fit_nn/unified_final1.py run/fit_nn/final1_launcher.py
          python -m compileall -q run/fit_nn/food_equal_final1
          python -m compileall -q run/fit_nn/krajbich2010_final1
          python -m compileall -q run/fit_nn/tavares2017_final1
      - name: Bash syntax check
        run: |
          bash -n run/fit_nn/food_equal_final1/submit.sh
          bash -n run/fit_nn/krajbich2010_final1/submit.sh
          bash -n run/fit_nn/tavares2017_final1/submit.sh
          bash -n run/fit_nn/food_equal_final1/submit_s1_s3.sh
          bash -n run/fit_nn/krajbich2010_final1/submit_s1_s3.sh
          bash -n run/fit_nn/tavares2017_final1/submit_s1_s3.sh
      - name: Check three data sources and exact mathematical priors
        run: python -m unittest discover -s run/fit_nn/tests -p test_unified_final1.py -v
