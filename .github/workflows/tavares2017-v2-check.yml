name: Tavares v2 full-timeline, six profile, binary parity checks

on:
  push:
    paths:
      - "run/fit_nn/tavares2017_bf_v2/**"
      - ".github/workflows/tavares2017-v2-check.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numpy Cython pandas and compiler build system
        run: python -m pip install "numpy<2" "pandas>=2" "Cython>=3" setuptools
      - name: Check variant Slurm launch shell syntax
        run: bash -n run/fit_nn/tavares2017_bf_v2/submit_variant.sh
      - name: Syntax validation for v2 Python files
        run: python -m compileall -q run/fit_nn/tavares2017_bf_v2
      - name: Verify variant conversion tests
        run: python -m unittest discover -s run/fit_nn/tavares2017_bf_v2/tests -p 'test_prepare_variants.py' -v
      - name: Verify comparative S5/S6 report math on synthetic fixtures
        run: python -m unittest discover -s run/fit_nn/tavares2017_bf_v2/tests -p 'test_compare_results.py' -v
      - name: Download canonical source with baseline adapter
        run: python run/fit_nn/tavares2017_bf/prepare_data.py
      - name: Create all 6 exact input profiles
        run: python -u run/fit_nn/tavares2017_bf_v2/prepare_variants.py
      - name: Compile the exact legacy Cython extension
        working-directory: packages/c_bifood
        run: python setup.py build_ext --inplace
      - name: Compile zero-drift full-timeline extension
        working-directory: run/fit_nn/tavares2017_bf_v2
        run: python setup_cython.py build_ext --inplace
      - name: Validate source counts, full-clock semantics, and binary Cython equivalence
        env:
          ATT_BF_VALUE_NORMALIZATION: dataset_max
        run: |
          export PYTHONPATH="$PWD/packages/c_bifood:$PWD/run/fit_nn/tavares2017_bf_v2:$PYTHONPATH"
          python -m unittest discover -s run/fit_nn/tavares2017_bf_v2/tests -p 'test_simulator.py' -v
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("data/tavares2017_v2")
          counts = {}
          for p in root.glob("*/manifest.json"):
              m = json.loads(p.read_text())
              counts[m["profile"]] = m["kept_trials"]
          assert len(counts) == 6, counts
          assert counts["active_thomas_all"] == 31854, counts
          assert counts["full_thomas_all"] == 31854, counts
          assert counts["active_thomas_qc"] == 30163, counts
          assert counts["full_thomas_qc"] == 30163, counts
          print("Verified profile counts:",counts)
          PY
